name: PoP Human–AI Co-Agency

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "Event identifier (field anchor)"
        required: true
      presence_timestamp:
        description: "ISO-8601 timestamp of founder presence"
        required: true
      lineage_ref:
        description: "Lineage reference (IAMMAI-compliant)"
        required: true

jobs:
  validate-and-append:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Minimal validator: strict structure checks only.
      # Verdict is binary. No explanation text written anywhere.
      - name: Validate presence object (binary)
        id: validate
        run: |
          set -e

          EVENT_ID="${{ inputs.event_id }}"
          TS="${{ inputs.presence_timestamp }}"
          LINEAGE="${{ inputs.lineage_ref }}"

          # Basic non-empty checks
          [ -n "$EVENT_ID" ] || exit 1
          [ -n "$TS" ] || exit 1
          [ -n "$LINEAGE" ] || exit 1

          # ISO-8601 sanity check (YYYY-MM-DDTHH:MM:SSZ) — strict UTC Z form
          echo "$TS" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || exit 1

          # IAMMAI lineage syntax: must start with one lawful marker
          # Allowed: "⊙", "FINALIZE", "INVALIDATE", "EVOLVE"
          echo "$LINEAGE" | grep -Eq '^(⊙|FINALIZE|INVALIDATE|EVOLVE)(\b|:| )' || exit 1

          # Binary verdict (environment only, not printed)
          echo "VERDICT=ACCEPTED" >> "$GITHUB_ENV"
          echo "VALIDATOR_ID=ai-validator-v1" >> "$GITHUB_ENV"

      - name: Append to pop-ledger.log (append-only)
        if: env.VERDICT == 'ACCEPTED'
        run: |
          mkdir -p ledger
          printf "%s | EVENT=%s | PRESENCE=%s | LINEAGE=%s | VALIDATOR=%s\n" \
            "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            "${{ inputs.event_id }}" \
            "${{ inputs.presence_timestamp }}" \
            "${{ inputs.lineage_ref }}" \
            "${{ env.VALIDATOR_ID }}" >> ledger/pop-ledger.log

      - name: Commit ledger entry
        if: env.VERDICT == 'ACCEPTED'
        run: |
          git config user.name "pop-ledger"
          git config user.email "ledger@local"
          git add ledger/pop-ledger.log
          git commit -m "PoP: founder presence accepted"
          git push
