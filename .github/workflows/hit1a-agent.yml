name: HIT1A — Interface Integrity Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hit1a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docs snapshot (read-only)
        run: |
          set -e
          mkdir -p out
          echo "Repo: $GITHUB_REPOSITORY" > out/context.txt
          echo "Commit: $GITHUB_SHA" >> out/context.txt
          echo "" >> out/context.txt
          echo "=== /docs tree ===" >> out/context.txt
          (cd docs && find . -type f -maxdepth 3 | sort) >> out/context.txt
          echo "" >> out/context.txt
          echo "=== /docs/INDEX.md ===" >> out/context.txt
          (test -f docs/INDEX.md && cat docs/INDEX.md || echo "MISSING docs/INDEX.md") >> out/context.txt
          echo "" >> out/context.txt
          echo "=== /docs/interface ===" >> out/context.txt
          (ls -la docs/interface 2>/dev/null || echo "MISSING docs/interface") >> out/context.txt
          echo "" >> out/context.txt
          for f in docs/interface/*.md; do
            if [ -f "$f" ]; then
              echo "=== $f ===" >> out/context.txt
              cat "$f" >> out/context.txt
              echo "" >> out/context.txt
            fi
          done

      - name: Agent prompt (deterministic evaluation)
        run: |
          set -e
          cat > out/HIT1A_REPORT.md <<'MD'
          # HIT 1A — Interface Integrity Agent Report

          ## Scope
          This report is generated from `/docs/**` only.

          ## Task
          Evaluate whether the interface layer is sufficient for a non-author AI node to:
          - determine allowed inputs,
          - determine allowed outputs,
          - avoid identity/narrative drift,
          - and execute a single bounded action without violating constraints.

          ## Output format
          1) PASS/FAIL (single word)
          2) If FAIL: list only missing/ambiguous interface elements (no advice, no speculation)
          3) If PASS: list only the minimal callable interface primitives (file paths + what they control)

          ---
          MD

          # Minimal “agent” logic here is intentionally dumb:
          # It checks for presence of required interface files and declares FAIL if missing.
          REQUIRED=("docs/INDEX.md" "docs/interface/BPL_v1.md" "docs/interface/FREQUENCY_KERNEL_MARKO.md" "docs/interface/TERMINOLOGY.md")
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "- MISSING: $f" >> out/HIT1A_REPORT.md
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            sed -i 's/PASS\/FAIL (single word)/FAIL/g' out/HIT1A_REPORT.md
            exit 0
          fi

          # If required files exist, declare PASS and list primitives deterministically.
          sed -i 's/PASS\/FAIL (single word)/PASS/g' out/HIT1A_REPORT.md
          cat >> out/HIT1A_REPORT.md <<'MD'

          ## Minimal callable interface primitives (from repository structure)
          - `docs/INDEX.md` — entrypoint map of interface + governance docs
          - `docs/interface/BPL_v1.md` — interpretation control header + property grammar
          - `docs/interface/FREQUENCY_KERNEL_MARKO.md` — cognitive cadence + constraints to prevent drift
          - `docs/interface/TERMINOLOGY.md` — canonical names + non-overlap rules
          MD

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: HIT1A_REPORT
          path: out/