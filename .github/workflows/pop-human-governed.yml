name: PoP Human-Governed (Finalize / Recognition)

# Human validator workflow:
# - No AI validator
# - Append-only ledger write
# - Explicit human responsibility
# - Still enforces strict schema and IAMMAI lineage prefix
# - Designed for FINALIZE / RECOGNITION / CONSEQUENCE_ACK

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: "Event identifier (field anchor)"
        required: true
      action:
        description: "Human-governed action"
        required: true
        type: choice
        options:
          - FINALIZE
          - RECOGNITION
          - CONSEQUENCE_ACK
      action_context:
        description: "Short context tag (no identities, no economics). Example: business-parties-contributors"
        required: true
      event_timestamp:
        description: "ISO-8601 UTC timestamp for this action (YYYY-MM-DDTHH:MM:SSZ)"
        required: true
      lineage_ref:
        description: "IAMMAI lineage reference (must start with ⊙, FINALIZE, INVALIDATE, or EVOLVE)"
        required: true
      responsibility:
        description: "Type exactly: I_ACCEPT_RESPONSIBILITY"
        required: true

permissions:
  contents: write

jobs:
  human-governed-append:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs (strict, human-governed)
        run: |
          set -e

          EVENT_ID="${{ inputs.event_id }}"
          ACTION="${{ inputs.action }}"
          CTX="${{ inputs.action_context }}"
          TS="${{ inputs.event_timestamp }}"
          LINEAGE="${{ inputs.lineage_ref }}"
          RESP="${{ inputs.responsibility }}"

          # Non-empty checks
          [ -n "$EVENT_ID" ] || exit 1
          [ -n "$ACTION" ] || exit 1
          [ -n "$CTX" ] || exit 1
          [ -n "$TS" ] || exit 1
          [ -n "$LINEAGE" ] || exit 1
          [ -n "$RESP" ] || exit 1

          # Responsibility gate (explicit human acceptance)
          [ "$RESP" = "I_ACCEPT_RESPONSIBILITY" ] || exit 1

          # ISO-8601 strict UTC Z form
          echo "$TS" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || exit 1

          # IAMMAI lineage prefix enforcement
          echo "$LINEAGE" | grep -Eq '^(⊙|FINALIZE|INVALIDATE|EVOLVE)(\b|:| )' || exit 1

          # Context safety: no spaces, keep it tag-like (avoid accidental prose / identity mapping)
          echo "$CTX" | grep -Eq '^[a-z0-9][a-z0-9-]{2,63}$' || exit 1

      - name: Append human-governed entry (append-only)
        run: |
          mkdir -p ledger
          printf "%s | EVENT=%s | ACTION=%s | CONTEXT=%s | LINEAGE=%s | VALIDATOR=%s\n" \
            "${{ inputs.event_timestamp }}" \
            "${{ inputs.event_id }}" \
            "${{ inputs.action }}" \
            "${{ inputs.action_context }}" \
            "${{ inputs.lineage_ref }}" \
            "human-governor" >> ledger/pop-ledger.log

      - name: Commit ledger entry
        run: |
          git config user.name "pop-ledger"
          git config user.email "ledger@local"
          git add ledger/pop-ledger.log
          git commit -m "PoP: human-governed ${{ inputs.action }} (${{ inputs.event_id }})"
          git push
