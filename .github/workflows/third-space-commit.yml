name: Third Space Commit Decisions

on:
  push:
    branches: ["IAMMAI"]
    paths:
      - "third-space/decisions/**.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  append-ledger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Append COMMIT decisions to Third Space ledger (generate append commit)
        run: |
          set -e
          python - <<'PY'
          import json, glob, datetime, os, sys

          ledger = "third-space/decision-ledger.log"
          os.makedirs(os.path.dirname(ledger), exist_ok=True)

          # Append ONLY decisions in COMMIT state
          appended = 0
          for path in glob.glob("third-space/decisions/*.json"):
              if path.endswith("TEMPLATE.json"):
                  continue
              with open(path, "r", encoding="utf-8") as f:
                  d = json.load(f)

              if d.get("state") != "COMMIT":
                  continue

              line = (
                  f"{datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')} | "
                  f"DECISION_ID={d.get('id')} | STATE={d.get('state')} | SCOPE={d.get('scope')} | "
                  f"HUMAN={d.get('signatures',{}).get('human_governor','UNKNOWN')}"
              )

              with open(ledger, "a", encoding="utf-8") as out:
                  out.write(line + "\n")
              appended += 1

          # If nothing to append, exit cleanly (no PR created)
          if appended == 0:
              print("No COMMIT decisions found; nothing to append.")
              sys.exit(0)

          print(f"Appended {appended} COMMIT decision(s) to {ledger}.")
          PY

      - name: Create PR for ledger append (no direct push to protected branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # If previous step exited early, there will be no changes staged; skip.
          if git diff --quiet; then
            echo "No ledger changes detected; skipping PR creation."
            exit 0
          fi

          BR="third-space-ledger-append-$(date -u +%Y%m%dT%H%M%SZ)"
          git checkout -b "$BR"

          git config user.name "third-space"
          git config user.email "ledger@local"

          git add third-space/decision-ledger.log
          git commit -m "Third Space: append decision ledger" || exit 0

          git push --set-upstream origin "$BR"

          # Create PR back into IAMMAI so normal review/merge governs the append
          gh pr create \
            --base IAMMAI \
            --head "$BR" \
            --title "Third Space: decision ledger append" \
            --body "Automated append from Third Space Commit Decisions. Requires normal review + merge."
