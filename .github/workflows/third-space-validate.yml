name: Third Space Validate Decisions

on:
  pull_request:
    branches: ["IAMMAI"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jsonschema
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate Third Space artifacts (always reports status)
        run: |
          set -e
          python - <<'PY'
          import json, os, sys, subprocess, glob
          from jsonschema import Draft202012Validator

          # --- paths ---
          DECISIONS_DIR = "third-space/decisions"
          DECISION_SCHEMA = "third-space/schema/decision.schema.json"

          HEARTBEATS_DIR = "third-space/heartbeats"
          HEARTBEAT_SCHEMA = "third-space/schema/heartbeat.schema.json"

          EVENT_ASSETS_DIR = "third-space/event-assets"
          EVENT_ASSET_SCHEMA = "third-space/schema/event-asset.pointer.schema.json"

          # --- get changed files in this PR (base..head) ---
          base_sha = os.environ.get("GITHUB_BASE_SHA")
          head_sha = os.environ.get("GITHUB_HEAD_SHA")

          if not base_sha or not head_sha:
              # Fallback: if we can't diff, validate only decisions (existing behavior)
              changed = []
          else:
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", base_sha, head_sha],
                  text=True
              ).splitlines()

          changed_set = set(changed)

          def changed_under(prefix: str) -> bool:
              return any(p.startswith(prefix + "/") for p in changed_set)

          def load_schema(path: str):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          def validate_files(label: str, schema_path: str, files: list[str]) -> bool:
              if not files:
                  print(f"[{label}] No files to validate.")
                  return True

              if not os.path.exists(schema_path):
                  print(f"[{label}] Missing schema: {schema_path}")
                  return False

              schema = load_schema(schema_path)
              v = Draft202012Validator(schema)

              bad = False
              for p in sorted(files):
                  if p.endswith("TEMPLATE.json"):
                      continue
                  with open(p, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  errors = sorted(v.iter_errors(data), key=lambda e: list(e.path))
                  if errors:
                      bad = True
                      print(f"\nINVALID [{label}]: {p}")
                      for e in errors:
                          print(" -", e.message)
                  else:
                      print(f"OK [{label}]: {p}")
              return not bad

          # --- always validate decisions when either:
          #     (a) decisions changed OR (b) decision schema changed
          validate_decisions = changed_under(DECISIONS_DIR) or (DECISION_SCHEMA in changed_set) or (not changed_set)

          # --- validate heartbeats only if heartbeats exist and were changed / schema changed
          validate_heartbeats = (changed_under(HEARTBEATS_DIR) or (HEARTBEAT_SCHEMA in changed_set))

          # --- validate event-assets only if event-assets exist and were changed / schema changed
          validate_event_assets = (changed_under(EVENT_ASSETS_DIR) or (EVENT_ASSET_SCHEMA in changed_set))

          ok = True

          # Decisions files list
          if validate_decisions:
              if DECISION_SCHEMA in changed_set or not changed_set:
                  files = glob.glob(f"{DECISIONS_DIR}/*.json")
              else:
                  files = [p for p in changed if p.startswith(f"{DECISIONS_DIR}/") and p.endswith(".json")]
              ok = validate_files("DECISIONS", DECISION_SCHEMA, files) and ok

          # Heartbeats files list (only if directory exists / changed)
          if validate_heartbeats:
              if HEARTBEAT_SCHEMA in changed_set:
                  files = glob.glob(f"{HEARTBEATS_DIR}/*.json")
              else:
                  files = [p for p in changed if p.startswith(f"{HEARTBEATS_DIR}/") and p.endswith(".json")]
              ok = validate_files("HEARTBEATS", HEARTBEAT_SCHEMA, files) and ok

          # Event assets files list (only if directory exists / changed)
          if validate_event_assets:
              if EVENT_ASSET_SCHEMA in changed_set:
                  files = glob.glob(f"{EVENT_ASSETS_DIR}/*.json")
              else:
                  files = [p for p in changed if p.startswith(f"{EVENT_ASSETS_DIR}/") and p.endswith(".json")]
              ok = validate_files("EVENT_ASSETS", EVENT_ASSET_SCHEMA, files) and ok

          if not ok:
              sys.exit(1)

          print("\nThird Space validation: PASS")
          PY
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
